<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF5B3A'><circle cx='12' cy='12' r='10'/><path d='M8 12l3 3 5-5' stroke='%23FFFFFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GroupPick — Warm, Fair Group Decisions</title>
    <meta name="description" content="Decide where to eat, stay, or visit with friends in 30 seconds. Private budgets, persistent fairness, and 3 explained options." />
    <!-- Google Fonts: Bricolage Grotesque 700 & DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Leaflet CSS for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Instant theme initialization to prevent FOUC -->
    <script>
      (function() {
        try {
          var p = new URLSearchParams(window.location.search).get('theme');
          var s = localStorage.getItem('gp_theme');
          var isDark = p === 'dark' || (!p && (s === 'dark' || (!s && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)));
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

      })();
    </script>
  </head>
  <body class="bg-paper dark:bg-paper-dark text-ink dark:text-ink-dark min-h-screen antialiased selection:bg-tomato-tint selection:text-tomato transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
